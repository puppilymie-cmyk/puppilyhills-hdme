<template>
  <style>

      src: url("assets/fonts/NotoSerifJP-400-08-cta.woff2") format("woff2");
      unicode-range: U+300c-300d, U+304b, U+304f, U+3057, U+306e-306f, U+3071, U+3089, U+309a,
        U+30a3, U+30af, U+30d5, U+30d7, U+30ea-30eb, U+30ed, U+30f3, U+30fc, U+8a73;

    #root .clip {
      position: absolute;

    /* full-bleed ground — the one frame that breaks blush from the ivory/beige rhythm */
    #root [id="08-cta-bg"] {
      inset: 0;

    }

    /* compass-drafted ring, Closing Plate treatment (frame.md) — quiet atmosphere behind the lockup */
    #root [id="08-cta-ring"] {
      left: 324px;

      border: 1px solid #ddc9ac;

  </style>

  <div id="root" data-composition-id="08-cta" data-width="1080" data-height="1920" data-start="0" data-duration="3">
    <div id="08-cta-bg" class="clip" data-start="0" data-duration="3" data-track-index="0"></div>

    <div id="08-cta-ring" class="clip" data-start="0" data-duration="3" data-track-index="1"></div>

    <div id="08-cta-wordmark" class="clip" data-start="0" data-duration="3" data-track-index="2">
      Puppily Delica
    </div>

    <svg
      id="08-cta-hairline"
      class="clip"
      data-start="0"
      data-duration="3"
      data-track-index="3"
      viewBox="0 0 280 6"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path id="08-cta-hairline-path" d="M 0 3 L 280 3"></path>
    </svg>

      「詳しくはプロフィールのリンクから」
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var ring = document.getElementById("08-cta-ring");
      var wordmark = document.getElementById("08-cta-wordmark");
      var hairlinePath = document.getElementById("08-cta-hairline-path");
      var ctaLine = document.getElementById("08-cta-line");

      // measured (not guessed) path length, per svg-path-draw
      var hairlineLen = hairlinePath.getTotalLength();
      hairlinePath.style.strokeDasharray = String(hairlineLen);
      hairlinePath.style.strokeDashoffset = String(hairlineLen);

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-0.3s): blush canvas, empty — nothing tweened yet, elements sit at their
      // fromTo "from" state (opacity 0 / drawn-out stroke) until their tween's start time.

      // Scene 2 (0.3-1.3s): wordmark spring-settles to center — small, restrained settle
      // (spring-pop-entrance, "calm settle" variant: power3.out, no overshoot, small y-rise).
      tl.fromTo(
        ring,
        { opacity: 0, scale: 0.94 },
        { opacity: 0.28, scale: 1, duration: 0.5, ease: "power3.out" },
        0.3,
      );

      tl.fromTo(
        wordmark,
        { opacity: 0, y: 10, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" },
        0.3,
      );

      // hairline rule draws in left-to-right beneath the wordmark once it has settled
      // (svg-path-draw: measured dash length, power2.out — a hand lifting at the end of stroke).
      tl.to(
        hairlinePath,
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        0.78,
      );

      // Scene 3 (1.3-3.0s): CTA line fades in below the hairline; both hold static to the
      // final frame — terminal frame, nothing moves again after this settle.
      tl.fromTo(
        ctaLine,
        { opacity: 0, y: 6 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power1.out" },
        1.3,
      );

      window.__timelines["08-cta"] = tl;
    })();
  </script>
