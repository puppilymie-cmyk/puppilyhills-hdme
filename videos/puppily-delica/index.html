<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #faf6f1;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="31.5"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-product-intro"
        class="scene"
        data-composition-id="02-product-intro"
        data-composition-src="compositions/frames/02-product-intro.html"
        data-start="4"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-03-philosophy"
        class="scene"
        data-composition-id="03-philosophy"
        data-composition-src="compositions/frames/03-philosophy.html"
        data-start="7.5"
        data-duration="5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-ingredients"
        class="scene"
        data-composition-id="04-ingredients"
        data-composition-src="compositions/frames/04-ingredients.html"
        data-start="12"

        data-track-index="1"
      ></div>

      <div
        id="el-05-functional"
        class="scene"
        data-composition-id="05-functional"
        data-composition-src="compositions/frames/05-functional.html"

        data-duration="6"
        data-track-index="0"
      ></div>

      <div
        id="el-06-taste"
        class="scene"
        data-composition-id="06-taste"
        data-composition-src="compositions/frames/06-taste.html"
        data-start="21"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-07-payoff"
        class="scene"
        data-composition-id="07-payoff"
        data-composition-src="compositions/frames/07-payoff.html"

        data-track-index="0"
      ></div>

      <div
        id="el-08-cta"
        class="scene"
        data-composition-id="08-cta"
        data-composition-src="compositions/frames/08-cta.html"
        data-start="28.5"

        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.fromTo("#el-02-product-intro", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.to("#el-02-product-intro", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 7.5);
        tl.fromTo("#el-03-philosophy", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 7.5);
        tl.to("#el-03-philosophy", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 12);
        tl.fromTo("#el-04-ingredients", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 12);
        tl.to("#el-04-ingredients", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 15.5);
        tl.fromTo("#el-05-functional", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 15.5);
        tl.to("#el-05-functional", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 21);
        tl.fromTo("#el-06-taste", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 21);
        tl.to("#el-06-taste", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 25.5);
        tl.fromTo("#el-07-payoff", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 25.5);
        tl.to("#el-07-payoff", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 28.5);
        tl.fromTo("#el-08-cta", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 28.5);
        tl.to({}, { duration: 31.5 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
